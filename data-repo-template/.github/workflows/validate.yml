# Copy into the private kidtube-data repo. Validates every push from the agent or the tablet.
name: validate
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: data }
      - uses: actions/checkout@v4
        with: { repository: OWNER/kidtube, path: kidtube }   # replace OWNER
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: kidtube
      - run: node kidtube/tools/validate.mjs data
