<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="ui.css">
<style>
  .bar { display: flex; align-items: center; gap: 12px; padding: 12px 16px 0; }
  .home { border: 0; border-radius: 14px; background: var(--accent); color: #fff; font: inherit; font-size: 18px; padding: 10px 18px; }
  .home:disabled { background: #d9d2c7; }
  .wait { color: var(--muted); font-weight: 500; }
  .grid { height: auto; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; padding: 12px 16px 24px; }
  .locked .card { filter: grayscale(1); opacity: .45; pointer-events: none; }
</style>
<body>
  <div class="bar"><button class="home" id="home">🏠 Home</button><span class="wait" id="wait"></span><button class="gear" id="gear" title="Parent settings" style="position:static;margin-left:auto">⚙️</button></div>
  <div class="grid" id="grid"></div>
  <script type="module" src="strip.js"></script>
</body>
