<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profiles & apps</title>
<link rel="stylesheet" href="../parent/parent.css">
<link rel="stylesheet" href="../settings/settings.css">
<style>
  main { max-width: 680px; padding-top: 16px; }
  h1 { margin-bottom: 4px; }
  .box { margin-top: 12px; }
  .box.current { border: 2px solid var(--accent); }
  .wait { color: var(--accent); font-weight: 600; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .foot { margin-top: 20px; }
</style>
<body>
<main>
  <h1>👤 Profiles & apps</h1>
  <p class="muted">Who uses this tablet. Each profile is one email with its own app; its lists, rules, notes and helper are its own. The PIN and the GitHub connection belong to the tablet.</p>

  <section id="gate" class="box" hidden>
    <h2>Enter PIN</h2>
    <input id="pin" class="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8">
    <button class="primary" id="pinGo">OK</button>
    <p class="err" id="pinErr"></p>
  </section>

  <div id="list"></div>
  <p class="foot"><a href="../options/options.html">⚙️ Settings</a></p>
</main>
<script src="../parent/boot.js"></script>
<script type="module" src="profiles.js"></script>
</body>
</html>
