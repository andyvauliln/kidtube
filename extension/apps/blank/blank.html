<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KidTube · Blank</title>
<!-- The "Blank (test)" app (lib/apps.js): a profile with this app sees only this white page on YouTube.
     Parent mode adds the apps header on top; the Parent | Kid switch sits top right (blank.js). -->
<style>
  html, body { margin: 0; min-height: 100%; background: #fff; color: #909090; font: 16px Roboto, system-ui, -apple-system, sans-serif; }
  body { display: flex; flex-direction: column; min-height: 100vh; }
  .top { display: flex; justify-content: flex-end; padding: 12px 16px; }
  .page { flex: 1; display: grid; place-items: center; text-align: center; padding: 24px; }
  @media (prefers-color-scheme: dark) { html, body { background: #0f0f0f; color: #777; } }
</style>
<body>
  <div id="appHeader"></div>
  <div class="top" id="mode"></div>
  <div class="page"><p>Blank test app.</p></div>
  <script src="../../core/ui/header.js"></script>
  <script type="module" src="blank.js"></script>
</body>
</html>
