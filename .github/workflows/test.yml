name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get install -y --no-install-recommends ffmpeg   # the voices test turns a WAV into an mp3
      - run: npm ci
      - run: npm test
      - run: node tools/validate.mjs tests/fixtures/good/data extension/apps/kidtube/data/default-config.json
